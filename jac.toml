[project]
name = "."
entry-point = "main.jac"
kind = "web-app"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "neutral"
font = "figtree"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[dependencies]
requests = ">=2.31.0"
redis = ">=5.0.0"
stripe = "~=15.3"

[dependencies.npm]
input-otp = "*"
embla-carousel-react = "*"
react-resizable-panels = "*"
"@radix-ui/react-slot" = "*"
cmdk = "*"
recharts = "*"
react-day-picker = "*"
sonner = "*"
vaul = "*"
"@base-ui/react" = "*"
"@hugeicons/react" = "*"
"@hugeicons/core-free-icons" = "*"
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/figtree" = "*"
shadcn = "^3.8.5"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
react-hook-form = "^7.71.0"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

# Served page <head> — title/description/favicon/OG for hosting.
# Domain assumed dash.jachammer.ai — change og_url/canonical if you host elsewhere.
# Icons = the favicon.io package in assets/ (served by the root asset route:
# /favicon.ico, /apple-touch-icon.png etc. resolve from <project>/assets/).
[client.app_meta_data]
title = "JacHammer Analytics"
description = "Internal analytics cockpit for JacHammer — honest, env-filtered product metrics, AI-built dashboards, and reports."
keywords = "jachammer, analytics, dashboard, jaseci"
author = "Jaseci Labs"
theme_color = "#0f172a"
icon = "/favicon.ico"
apple_touch_icon = "/apple-touch-icon.png"
og_title = "JacHammer Analytics"
og_description = "Internal analytics cockpit for JacHammer."
og_type = "website"
og_site_name = "JacHammer Analytics"
og_url = "https://dash.jachammer.ai"
canonical = "https://dash.jachammer.ai"

# Hosting hardening: without this, jac-scale signs JWTs with a PUBLIC default key
# and anyone can forge an admin token. ${JWT_SECRET} errors at boot if unset —
# deliberate: set it in .env locally and in the host's secret store in prod.
[scale.jwt]
secret = "${JWT_SECRET}"

# Run as a single in-process gateway (metrics_sv is imported in-process by main.jac).
# Without this the scale layer auto-detects metrics_sv + billing_sv as separate
# microservices and spawns them as subprocesses -> byllm/import crash.
# (Config flattened in jaclang: [plugins.scale.microservices] -> [scale.microservices].)
[scale.microservices]
enabled = false

# 0.34 gates byLLM's optional deps (litellm/httpx/loguru/pillow) behind the 'llm'
# capability; this section declares the intent so `jac install` syncs them.
# Model selection stays in code (INSIGHT_LLM env, default claude-haiku-4-5).
[byllm]
